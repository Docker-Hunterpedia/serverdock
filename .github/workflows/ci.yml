name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR runs are cancelled; push runs never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: bench trigger script tests
        run: .github/scripts/bench-needed_test.sh
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" -o serverdock-linux-${{ matrix.goarch }} ./cmd/serverdock
      - name: report sizes
        run: |
          f=serverdock-linux-${{ matrix.goarch }}
          raw=$(stat -c %s "$f"); gz=$(gzip -9 -c "$f" | wc -c)
          echo "$f raw=$raw gzip9=$gz"
          echo "| $f | $raw | $gz |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serverdock-linux-${{ matrix.goarch }}
          path: serverdock-linux-${{ matrix.goarch }}

  # Decide whether the (slow) bench needs to run (.github/scripts/bench-needed.sh):
  # only when Go code, module files, bench/web files, workflows or CI scripts
  # changed. A docs-only increment reuses a passing bench-gate of this workflow.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read # gh run list / view
    outputs:
      bench: ${{ steps.diff.outputs.bench }}
      reason: ${{ steps.diff.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
        run: .github/scripts/bench-needed.sh

  # One job per scenario and runner. ubuntu-latest gates; the arm64 runner
  # reports only. Scenarios 2 and 4 gate; 1 and 3 are report only (ADR 0008).
  bench:
    needs: [lint-test, changes]
    if: needs.changes.outputs.bench == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        scenario: ["1", "2", "3", "4"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: bench scenario ${{ matrix.scenario }}
        # The arm64 runner only reports; the ubuntu-latest job gates.
        continue-on-error: ${{ matrix.runner != 'ubuntu-latest' }}
        env:
          SCENARIOS: ${{ matrix.scenario }}
        run: bench/run.sh
      - name: summary
        if: always()
        run: cat bench/results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.runner }}-s${{ matrix.scenario }}
          path: bench/results/

  # The one required check for the bench. It always runs and fails closed: a
  # skipped, cancelled or failed dependency can never read as a pass. (The
  # expanded "bench (...)" checks do not exist when the matrix is skipped, so
  # they cannot be required.)
  bench-gate:
    needs: [changes, bench]
    if: always() # never !cancelled(): a skipped gate counts as passing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      BENCH_NEEDED: ${{ needs.changes.outputs.bench }}
      BENCH_RESULT: ${{ needs.bench.result }}
      REASON: ${{ needs.changes.outputs.reason }}
    steps:
      - run: |
          [ "$CHANGES_RESULT" = success ] || { echo "changes job did not succeed"; exit 1; }
          if [ "$BENCH_NEEDED" = true ] && [ "$BENCH_RESULT" != success ]; then
            echo "bench required but result is $BENCH_RESULT"; exit 1
          fi
          if [ "$BENCH_NEEDED" != true ] && [ "$BENCH_NEEDED" != false ]; then
            echo "changes job gave no bench decision"; exit 1
          fi
          echo "bench: $BENCH_NEEDED ($REASON)" >> "$GITHUB_STEP_SUMMARY"
