name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" -o serverdock-linux-${{ matrix.goarch }} ./cmd/serverdock
      - name: report sizes
        run: |
          f=serverdock-linux-${{ matrix.goarch }}
          raw=$(stat -c %s "$f"); gz=$(gzip -9 -c "$f" | wc -c)
          echo "$f raw=$raw gzip9=$gz"
          echo "| $f | $raw | $gz |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serverdock-linux-${{ matrix.goarch }}
          path: serverdock-linux-${{ matrix.goarch }}

  bench:
    needs: lint-test
    # ubuntu-latest is the gate; the arm64 runner reports only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            gate: true
          - runner: ubuntu-24.04-arm
            gate: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: bench (scenarios 1-2)
        # Report-only runners never fail the job; the gate runner does.
        continue-on-error: ${{ !matrix.gate }}
        run: bench/run.sh
      - name: summary
        if: always()
        run: cat bench/results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.runner }}
          path: bench/results/
