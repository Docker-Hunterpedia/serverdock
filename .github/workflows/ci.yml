name: ci
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not in the default set; it starts the bench when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * *" # nightly full bench on main, amd64 + arm64
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; push runs never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: bench trigger script tests
        run: .github/scripts/bench-needed_test.sh
      - run: go test -race ./...
      - name: test hooks and the lock-order checker (the tag build that only internal/testbin and this step use)
        # The whole package, so the checker sees every runner, resync, watcher and
        # delete test: any lock taken out of order fails the run (TestMain).
        run: go test -race -tags testhooks -count=1 ./internal/deploy
      - run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...

  # The single-page app (Node is needed here and in `make web` only). Its output,
  # web/build, is uploaded once; the build and bench jobs embed it with -tags spa.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: svelte-check
        run: npm run check
      - name: build, gzip and check the 250 KB JavaScript budget
        run: npm run build
      - name: generated API types match docs/api/openapi.json
        run: |
          npm run types
          git diff --exit-code -- src/lib/api-types.ts || { echo "run 'make web-types' and commit"; exit 1; }
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev
      - name: npm audit (all dependencies, high and above)
        # Dev dependencies (vite, the plugins) write the shipped bundle, so they count.
        run: npm audit --audit-level=high
      - name: report sizes
        run: |
          js=$(find build -name '*.js' -exec gzip -9 -c {} + | wc -c)
          echo "web build: JavaScript gzip-9 total $js bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 7

  # Playwright + axe against the real binary (-tags spa) on high ports with a temp
  # data directory: the A5 projects (desktop, phone, 320 px, 200% zoom, dark,
  # reduced motion, forced colours, WebKit). Zero axe violations, no CSP violations.
  # Three jobs: the UI projects in three shards (no Docker needed), the real-Docker
  # flows apart (a Docker network or container appearing changes the host's network
  # interfaces, and Chromium aborts every other test's in-flight requests when that
  # happens: net::ERR_NETWORK_CHANGED), and one small job that reads every report so
  # the flaky limit stays global.
  e2e-ui:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25 # a shard takes 12-15 min in CI (plan 0004 Revision 20): about 1.7x
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build
      - name: build the binary with the app embedded
        run: |
          CGO_ENABLED=0 go build -tags spa -trimpath -o bin/serverdock ./cmd/serverdock
          bin/serverdock version | tee /dev/stderr | grep -q ' ui=spa$'
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: install the browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - name: playwright (UI projects, one shard of 3)
        env:
          SHARD: ${{ matrix.shard }}
        run: E2E_SET=ui E2E_REPORT="ui-$SHARD" npx playwright test --shard="$SHARD/3"
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report-ui-${{ matrix.shard }}
          include-hidden-files: true
          path: web/e2e/.reports
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-ui-${{ matrix.shard }}
          include-hidden-files: true
          path: web/e2e/.results
          if-no-files-found: ignore
          retention-days: 7

  e2e-docker:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15 # takes about 8 min in CI: about 1.9x
    env:
      # registry:2, pinned by digest (the same multi-arch index as the integration job).
      REGISTRY_IMAGE: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      # The test app the "create and deploy" tests run from the local registry.
      SD_TEST_APP_IMAGE: 127.0.0.1:5000/sd-testapp:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build
      - name: build the binary with the app embedded
        run: |
          CGO_ENABLED=0 go build -tags spa -trimpath -o bin/serverdock ./cmd/serverdock
          bin/serverdock version | tee /dev/stderr | grep -q ' ui=spa$'
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: start a local registry on 127.0.0.1:5000
        # The tests that deploy for real pull from it (the server runs with
        # --allow-loopback-registry in those tests only; e2e/server.ts).
        run: |
          docker run -d --name sd-registry -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && exit 0
            sleep 1
          done
          echo "registry did not start"; docker logs sd-registry; exit 1
      - name: build and push the test app image
        run: |
          docker build -t "$SD_TEST_APP_IMAGE" internal/agent/dockerapi/testdata/app
          docker push "$SD_TEST_APP_IMAGE"
      - name: install the browsers
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: playwright (real Docker flows, one worker)
        run: E2E_SET=docker E2E_REPORT=docker npx playwright test --workers=1
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report-docker
          include-hidden-files: true
          path: web/e2e/.reports
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-docker
          include-hidden-files: true
          path: web/e2e/.results
          if-no-files-found: ignore
          retention-days: 7
      - name: registry log on failure
        if: failure()
        run: docker logs sd-registry || true

  # Reads every shard's report once, so "more than 3 flaky tests" counts the whole run.
  e2e:
    needs: [e2e-ui, e2e-docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-report-*
          merge-multiple: true
          path: web/e2e/.reports
      - name: a job that did not finish fails the run
        if: needs.e2e-ui.result != 'success' || needs.e2e-docker.result != 'success'
        env:
          UI_RESULT: ${{ needs.e2e-ui.result }}
          DOCKER_RESULT: ${{ needs.e2e-docker.result }}
        run: |
          echo "e2e-ui: $UI_RESULT, e2e-docker: $DOCKER_RESULT"
          exit 1
      - name: flaky tests (fails above 3)
        if: always()
        run: node e2e/flaky-report.mjs
        working-directory: web

  build:
    needs: [lint-test, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags spa -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" -o serverdock-linux-${{ matrix.goarch }} ./cmd/serverdock
      - name: assert the app is embedded (ui=spa)
        run: |
          f=serverdock-linux-${{ matrix.goarch }}
          go version -m "$f" | grep -q -- '-tags=spa' || { echo "built without -tags spa"; exit 1; }
          if [ "${{ matrix.goarch }}" = amd64 ]; then ./"$f" version | tee /dev/stderr | grep -q ' ui=spa$'; fi
      - name: report sizes
        run: |
          f=serverdock-linux-${{ matrix.goarch }}
          raw=$(stat -c %s "$f"); gz=$(gzip -9 -c "$f" | wc -c)
          echo "$f raw=$raw gzip9=$gz"
          echo "| $f | $raw | $gz |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serverdock-linux-${{ matrix.goarch }}
          path: serverdock-linux-${{ matrix.goarch }}

  # Decide whether the (slow) bench needs to run (.github/scripts/bench-needed.sh):
  # only when Go code, module files, bench/web files, workflows or CI scripts
  # changed. A docs-only increment reuses a passing bench-gate of this workflow.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list / view
    outputs:
      bench: ${{ steps.diff.outputs.bench }}
      reason: ${{ steps.diff.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "bench=true" >> "$GITHUB_OUTPUT"
            echo "reason=scheduled or manual full bench" >> "$GITHUB_OUTPUT"
          else
            .github/scripts/bench-needed.sh
          fi

  # Docker integration tests (-tags integration): the real Docker on the runner
  # and a local registry:2 on loopback, with the test app image built from
  # internal/agent/dockerapi/testdata/app and pushed to it. Runs when `changes`
  # says code changed (the same decision as the bench), so a docs-only PR skips
  # it; a skipped job is not a failure. Not needed by the bench jobs.
  integration:
    needs: [changes]
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # registry:2, pinned by digest (the multi-arch index).
      REGISTRY_IMAGE: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      SD_TEST_APP_IMAGE: 127.0.0.1:5000/sd-testapp:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: start a local registry on 127.0.0.1:5000
        run: |
          docker run -d --name sd-registry -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && exit 0
            sleep 1
          done
          echo "registry did not start"; docker logs sd-registry; exit 1
      - name: build and push the test app image
        run: |
          docker build -t "$SD_TEST_APP_IMAGE" internal/agent/dockerapi/testdata/app
          docker push "$SD_TEST_APP_IMAGE"
      - name: go test -race -tags integration
        # Only packages that have integration-tagged tests; add new ones here.
        run: go test -race -tags integration -count=1 ./internal/agent/dockerapi/... ./internal/agentops/... ./internal/deploy/...
      - name: go test -race -tags integration, the kill -9 suite (plan 0004 step 10)
        # The real binary (built with the test hooks by internal/testbin) is killed with
        # SIGKILL at every blue-green and stop-first stage and started again; -v prints
        # the OUTAGE lines (SIGKILL to the first 2xx).
        run: go test -race -tags integration -count=1 -timeout 15m -v -run 'TestKillNine' ./cmd/serverdock
      - name: go test -race -tags integration, Docker daemon restart (TestDaemonRestartKeepsRoutesCorrect)
        # Last, and alone: it restarts the daemon (and so stops the registry).
        env:
          SD_TEST_DOCKER_RESTART: "1"
        run: go test -race -tags integration -count=1 -v -run 'TestDaemonRestartKeepsRoutesCorrect' ./internal/deploy
      - name: registry log on failure
        if: failure()
        run: docker logs sd-registry || true

  # One job per scenario and runner. ubuntu-latest gates; the arm64 runner
  # reports only and runs nightly (schedule) or on manual dispatch, not per push.
  # Scenarios 2 and 4 gate; 1 and 3 are report only (ADR 0008).
  # Draft PRs skip the bench: it runs when the PR is marked ready and on every
  # push after that, on every push to main, and nightly.
  bench:
    needs: [lint-test, changes, web]
    if: >-
      needs.changes.outputs.bench == 'true' &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","ubuntu-24.04-arm"]') || fromJSON('["ubuntu-latest"]') }}
        scenario: ["1", "2", "3", "4"]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build
      - name: bench scenario ${{ matrix.scenario }}
        # The arm64 runner only reports; the ubuntu-latest job gates.
        continue-on-error: ${{ matrix.runner != 'ubuntu-latest' }}
        env:
          SCENARIOS: ${{ matrix.scenario }}
        run: bench/run.sh
      - name: summary
        if: always()
        run: cat bench/results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.runner }}-s${{ matrix.scenario }}
          path: bench/results/

  # The one required check for the bench. It always runs (on a draft PR it fails on
  # purpose, below) and fails closed: a skipped, cancelled or failed dependency
  # can never read as a pass. (The
  # expanded "bench (...)" checks do not exist when the matrix is skipped, so
  # they cannot be required.)
  # On a draft PR the bench is skipped and the gate FAILS on purpose ("the bench
  # has not run on this code"). It must not be skipped: GitHub counts a skipped
  # required check as passing, which would leave a green gate on the head SHA
  # until the ready_for_review run replaces it. A draft cannot be merged, so the
  # red gate costs nothing; marking the PR ready runs the full bench.
  bench-gate:
    needs: [changes, bench]
    if: always() # never !cancelled(): a skipped gate counts as passing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      BENCH_NEEDED: ${{ needs.changes.outputs.bench }}
      BENCH_RESULT: ${{ needs.bench.result }}
      REASON: ${{ needs.changes.outputs.reason }}
      EVENT: ${{ github.event_name }}
      DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - run: |
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then
            echo "draft PR: the bench has not run on this code (it runs when the PR is marked ready)"
            echo "bench: not run (draft PR)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [ "$CHANGES_RESULT" = success ] || { echo "changes job did not succeed"; exit 1; }
          if [ "$BENCH_NEEDED" = true ] && [ "$BENCH_RESULT" != success ]; then
            echo "bench required but result is $BENCH_RESULT"; exit 1
          fi
          if [ "$BENCH_NEEDED" != true ] && [ "$BENCH_NEEDED" != false ]; then
            echo "changes job gave no bench decision"; exit 1
          fi
          echo "bench: $BENCH_NEEDED ($REASON)" >> "$GITHUB_STEP_SUMMARY"
