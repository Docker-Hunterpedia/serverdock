name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Check [features.md](https://github.com/Docker-Hunterpedia/serverdock/blob/main/docs/features.md) and the [roadmap](https://github.com/Docker-Hunterpedia/serverdock/blob/main/docs/roadmap.md) first, since it may already be planned."
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like ServerDock to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do other tools handle it?
      description: Coolify, Dokploy, Portainer, Kamal, etc. Links help.
  - type: dropdown
    id: who
    attributes:
      label: Who needs it?
      options:
        - Solo / homelab
        - Small team / agency
        - Company
