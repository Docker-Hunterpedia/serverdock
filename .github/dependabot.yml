# Weekly, grouped update PRs for pinned Action SHAs, Go modules and npm packages
# (docs/security.md gap G14). Security updates still arrive immediately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site/deploy
    schedule:
      interval: weekly
    groups:
      site-deploy:
        patterns: ["*"]
